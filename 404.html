<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Flango</title>
    <script>
      // GitHub Pages SPA redirect for client-side routed apps
      var path = window.location.pathname;

      // Ugeplan SPA routes
      if (path.indexOf('/ugeplan/') === 0 && path !== '/ugeplan/') {
        window.location.replace('/ugeplan/?p=' + encodeURIComponent(path));
      }

      // /ugeplan-next/ var v5-remakens sidesti indtil cutoveret 29-07-2026.
      // Dybe links dertil sendes til den rigtige ugeplan med ruten bevaret.
      if (path.indexOf('/ugeplan-next/') === 0) {
        window.location.replace('/ugeplan/?p=' + encodeURIComponent(path.replace('/ugeplan-next/', '/ugeplan/')));
      }

      // Kommunens flade (rammestyring + tilsyn) — client-side routes under /kommune/
      if (path.indexOf('/kommune/') === 0 && path !== '/kommune/') {
        window.location.replace('/kommune/?p=' + encodeURIComponent(path));
      }
    </script>
  </head>
  <body>
    <h1>Side ikke fundet</h1>
    <p><a href="/">Gå til forsiden</a></p>
  </body>
</html>
