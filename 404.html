<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Flango</title>
    <script>
      // GitHub Pages SPA redirect for client-side routed apps
      var path = window.location.pathname;

      // Ugeplan SPA routes
      if (path.indexOf('/ugeplan/') === 0 && path !== '/ugeplan/') {
        window.location.replace('/ugeplan/?p=' + encodeURIComponent(path));
      }

      // Ugeplan v5-remaken kører på sidestien indtil den afløser /ugeplan/
      if (path.indexOf('/ugeplan-next/') === 0 && path !== '/ugeplan-next/') {
        window.location.replace('/ugeplan-next/?p=' + encodeURIComponent(path));
      }

      // Kommunens flade (rammestyring + tilsyn) — client-side routes under /kommune/
      if (path.indexOf('/kommune/') === 0 && path !== '/kommune/') {
        window.location.replace('/kommune/?p=' + encodeURIComponent(path));
      }
    </script>
  </head>
  <body>
    <h1>Side ikke fundet</h1>
    <p><a href="/">Gå til forsiden</a></p>
  </body>
</html>
