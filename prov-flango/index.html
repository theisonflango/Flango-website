<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Prøv Flango – Flango</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/nav.css" />
  <style>
    :root {
      --bg: #f5f5fb;
      --bg-soft: #ffffff;
      --accent: #ff7a3c;
      --accent-dark: #e0521f;
      --text-main: #111827;
      --text-muted: #4b5563;
      --border-soft: #e5e7eb;
      --radius-lg: 18px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: 'Nunito', system-ui, -apple-system, sans-serif; background: radial-gradient(circle at top, #ffe8d6 0, #f5f5fb 38%, #f9fafb 100%); color: var(--text-main); }
    a { color: inherit; text-decoration: none; }
    .page { min-height: 100vh; max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 40px; }
    .page-title { margin: 0; font-size: clamp(24px,4vw,30px); font-family: 'Baloo 2', cursive; }
    .page-intro { font-size: 15px; color: var(--text-muted); max-width: 60ch; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; font-size: 15px; font-weight: 600; background: linear-gradient(135deg, #ff7a3c, #ff4b73); color: #fff; box-shadow: 0 14px 30px rgba(248,113,113,0.5); margin-top: 12px; }
    .btn:hover { opacity: 0.95; }
    footer { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-soft); font-size: 12px; color: #9ca3af; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    footer a { color: #9ca3af; text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <div class="flango-nav-mount"></div>
  <main class="page">
    <section>
      <h1 class="page-title">Prøv Flango</h1>
      <p class="page-intro">Book en kort, uforpligtende online-gennemgang af Flango. Vi viser jer systemet og svarer på spørgsmål – så I kan mærke om det passer til jeres SFO.</p>
      <a class="btn" href="mailto:kontakt@flango.dk?subject=Flango%20demo&body=Hej%20Flango%2C%0A%0AVi%20vil%20gerne%20høre%20mere%20om%20caf%C3%A9systemet%20til%20vores%20institution.%0A%0AMvh%20">✉️ Book en demo</a>
    </section>
    <footer>
      <div>© <span id="year"></span> Flango – SFO'ernes cafésystem</div>
      <div>
        <a href="/forældre/">Forældre Portal</a> ·
        <a href="/#priser">Priser</a> ·
        <a href="/om-flango/">Om Flango</a> ·
        <a href="/sikkerhed/">Sikkerhed</a> ·
        <a href="/privatlivspolitik/">Privatlivspolitik</a> ·
        <a href="/gdpr/">GDPR</a> ·
        <a href="/#kontakt">Kontakt</a>
      </div>
    </footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="/shared/nav.js"></script>
</body>
</html>
